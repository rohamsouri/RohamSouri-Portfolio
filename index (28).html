<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXI AI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  height:100vh;
  background:#0f0f10;
  color:white;
  overflow:hidden;
}

/* TOPBAR */
.topbar{
  height:55px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 12px;
  background:#161618;
  border-bottom:1px solid #2a2a2a;
}

.menuBtn{
  font-size:22px;
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

/* APP */
.app{
  display:flex;
  height:calc(100vh - 55px);
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#151517;
  border-right:1px solid #2a2a2a;
  padding:10px;
  display:flex;
  flex-direction:column;
  transition:0.2s;
}

.sidebar.hidden{
  transform:translateX(-100%);
  position:absolute;
}

/* CHAT LIST */
.title{
  font-weight:bold;
  margin:10px 0;
}

.chatList{
  flex:1;
}

.empty{
  opacity:0.5;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* MESSAGES */
#messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* CHAT BUBBLES */
.msg{
  max-width:90%;
  padding:12px;
  border-radius:16px;
  word-wrap:break-word;
}

.user{
  background:#2a2a2a;
  margin-left:auto;
  border-bottom-right-radius:4px;
}

.ai{
  background:#1a1a1a;
  margin-right:auto;
  border-bottom-left-radius:4px;
}

/* INPUT */
.inputBar{
  display:flex;
  gap:10px;
  padding:10px;
  border-top:1px solid #2a2a2a;
  background:#161618;
}

.inputBar input{
  flex:1;
  padding:14px;
  border-radius:20px;
  border:1px solid #333;
  background:#1a1a1a;
  color:white;
  outline:none;
}

.inputBar button{
  padding:14px 18px;
  border:none;
  border-radius:12px;
  background:#2a2a2a;
  color:white;
  cursor:pointer;
}
.sidebar-item{
  padding:10px;
  margin:5px 0;
  background:#1f1f22;
  border-radius:8px;
  cursor:pointer;
}

.sidebar-item:hover{
  background:#2a2a2a;
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">
  <button id="menuBtn" class="menuBtn">☰</button>
  <div>✨ VEXI AI</div>
  <div></div>
</div>

<!-- APP -->
<div class="app">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar hidden">

  <div style="font-weight:bold; margin-bottom:10px;">Menu</div>

  <div class="sidebar-item">📚 Library & Media</div>
  <div class="sidebar-item">🧠 Memory</div>
  <div class="sidebar-item">📁 Workspace</div>
  <div class="sidebar-item">🔌 Extensions</div>
  <div class="sidebar-item">⚙ Settings</div>

  <hr style="margin:10px 0; border:1px solid #2a2a2a;">

  <div class="title">Chats</div>
  <div class="chatList">
    <div class="empty">No chats yet</div>
  </div>

</aside>

  <!-- MAIN -->
  <main class="main">

    <div id="messages"></div>

    <div class="inputBar">
      <input id="input" type="text" placeholder="Message VEXI..." />
      <button id="sendBtn">⬆</button>
    </div>

  </main>

</div>

<script>
const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");

const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const messages = document.getElementById("messages");

/* SIDEBAR */
menuBtn.onclick = () => {
  sidebar.classList.toggle("hidden");
};

/* ADD MESSAGE */
function addMessage(role, text){
  const div = document.createElement("div");
  div.classList.add("msg", role);
  div.innerText = text;

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

/* SEND MESSAGE */
async function sendMessage(){
  const text = input.value.trim();
  if(!text) return;

  input.value = "";

  addMessage("user", text);

  try{
    const res = await fetch("/chat", {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await res.json();

    addMessage("ai", data.reply);

  }catch(err){
    addMessage("ai", "Error: " + err);
  }
}

sendBtn.onclick = sendMessage;

input.addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){
    sendMessage();
  }
});
</script>

</body>
</html>
